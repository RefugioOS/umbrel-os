manifestVersion: 1
id: refugioos-2fauth
category: security
name: 2FAuth
version: "8.0.2-refugioos.1"
tagline: Gestiona tus codigos 2FA y genera OTP desde tu servidor
description: >-
  ES: 2FAuth es un gestor web de autenticacion de doble factor: guarda los
  secretos TOTP/HOTP de tus cuentas en tu propio servidor y genera los codigos
  desde cualquier navegador. Soporta WebAuthn/passkeys, grupos, compartir
  cuentas de forma segura, API y extensiones de navegador/oficiales.

  EN: 2FAuth is a web manager for two-factor authentication: store your TOTP/
  HOTP secrets on your own server and generate codes from any browser. Supports
  WebAuthn/passkeys, groups, secure sharing, an API and official extensions.

  This UmbrelOS package is a RefugioOS port built from source, pinned to an
  upstream commit.
