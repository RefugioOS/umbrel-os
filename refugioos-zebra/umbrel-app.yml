manifestVersion: 1
id: refugioos-zebra
category: finance
name: Zebra (Zcash Node)
version: "6.3.0-refugioos.2"
tagline: Nodo Zcash completo / Full Zcash node
description: >-
  ES: Port puro del nodo Zcash Zebra (zebrad) de la Zcash Foundation, con los
  binarios oficiales verificados por SHA256. Mantiene la cadena Zcash en tu
  Umbrel (P2P 8233), expone RPC JSON en 8232 con autenticacion por cookie y
  sirve una pagina de estado local en 48232 con el estado del nodo, su salud
  (/healthy y /ready) y el log del sync. Requiere ~300 GB de disco y 4 GB de
  RAM minimo (16 GB recomendado); el sync inicial es largo.

  EN: Pure port of the Zcash Foundation's Zebra (zebrad) Zcash node using the
  official SHA256-verified binaries. Keeps the Zcash chain on your Umbrel
  (P2P 8233), exposes JSON-RPC on 8232 with cookie auth, and serves a local
  status page on 48232 with node state, health (/healthy and /ready) and the
  sync log. Requires ~300 GB disk and 4 GB RAM minimum (16 GB recommended);
  initial sync takes a long time.
developer: RefugioOS
