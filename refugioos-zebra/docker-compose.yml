version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: refugioos-zebra_zebrad_1
      APP_PORT: "8080"
      PROXY_AUTH_ADD: "false"

  zebrad:
    image: ghcr.io/refugioos/zebra:6.3.0-refugioos.1
    restart: unless-stopped
    ports:
      - "8232:8232/tcp"
      - "8233:8233/tcp"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c '</dev/tcp/127.0.0.1/8233' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 30s
