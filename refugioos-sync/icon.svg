<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Refugio Sync">
  <defs>
    <linearGradient id="bg" x1="80" y1="40" x2="420" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1320"/>
      <stop offset="1" stop-color="#0a1f35"/>
    </linearGradient>
    <linearGradient id="arc1" x1="141" y1="95" x2="371" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="arc2" x1="371" y1="210" x2="141" y2="325" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Top arc: left → right via top (clockwise) -->
  <path d="M 148,210 A 108,108 0 0,1 364,210"
        fill="none" stroke="url(#arc1)" stroke-width="22" stroke-linecap="round"/>
  <!-- Arrowhead at right end (364,210), tangent points down -->
  <polygon points="364,244 344,206 384,206" fill="#38bdf8"/>

  <!-- Bottom arc: right → left via bottom (clockwise) -->
  <path d="M 364,210 A 108,108 0 0,1 148,210"
        fill="none" stroke="url(#arc2)" stroke-width="22" stroke-linecap="round"/>
  <!-- Arrowhead at left end (148,210), tangent points up -->
  <polygon points="148,176 128,214 168,214" fill="#0ea5e9"/>

  <!-- USB drive icon centered at (256, 204) -->
  <!-- Connector (top) -->
  <rect x="234" y="162" width="44" height="24" rx="6" fill="#7dd3fc"/>
  <!-- Drive body -->
  <rect x="218" y="182" width="76" height="52" rx="10" fill="#38bdf8"/>
  <!-- Indicator slot -->
  <rect x="240" y="196" width="32" height="9" rx="4" fill="#0b1320" opacity="0.45"/>
  <!-- LED dot -->
  <circle cx="256" cy="216" r="5" fill="#7dd3fc" opacity="0.8"/>

  <!-- Text -->
  <text x="256" y="396" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800"
        fill="#ffffff">Refugio</text>
  <text x="256" y="455" text-anchor="middle"
        font-family="Inter, Arial, sans-serif" font-size="56" font-weight="800"
        fill="#38bdf8">Sync</text>
</svg>
